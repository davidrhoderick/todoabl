enum ListColor {
  BLUE
  GRAY
  GREEN
  ORANGE
  PINK
  PURPLE
  RED
  YELLOW
}

type TaskList {
  color: ListColor
  id: ID!
  name: String!
  tasks(includeCompleted: Boolean = false, state: TaskState): [Task!]!
}

input CreateListInput {
  color: ListColor
  name: String!
}

type CreateListPayload {
  list: TaskList!
}
